<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsitektur End-to-End — Remote Claude Code dari Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arsitektur · Huawei Wearable Agents · Lane A (MVP)</p>
    <h1>Remote Claude Code dari Watch — End-to-End</h1>

    <svg viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e2e-arch-title e2e-arch-desc">
      <title id="e2e-arch-title">Arsitektur end-to-end Watch Fit 4 Pro sebagai remote Claude Code</title>
      <desc id="e2e-arch-desc">Empat komponen terhubung kiri ke kanan: aplikasi watch di Watch Fit 4 Pro, aplikasi bridge Kotlin di Android, server cw-hub di Termux sebagai simpul kontrak, dan sesi Claude Code dalam tmux; watch dan bridge berkomunikasi via Wear Engine P2P, bridge dan Claude berkomunikasi dengan cw-hub via HTTP localhost 8742.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->

      <rect x="296" y="248" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="257" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ANDROID · HP</text>

      <rect x="564" y="244" width="412" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="576" y="248" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="257" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TERMUX · PROSES</text>

      <!-- Connectors -->
      <path d="M 300,308 H 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 200,336 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 480,296 H 580" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 480,336 H 580" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 880,360 V 436 Q 880,444 872,444 H 678 Q 670,444 670,436 V 360" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <rect x="214" y="288" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P2P · PUSH</text>
      <rect x="210" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P2P · ACTION</text>
      <rect x="497" y="276" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /STATE</text>
      <rect x="487" y="316" width="86" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCREEN · KEYS</text>
      <rect x="733" y="424" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="775" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /NOTIFY</text>

      <!-- Editorial aside -->
      <text x="596" y="396" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Termux, bridge, dan Huawei Health wajib</text>
      <text x="596" y="412" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">hidup — layar HP boleh mati total.</text>

      <!-- Nodes -->
      <rect x="40" y="280" width="160" height="80" rx="6" fill="#f5f5f5"/>

      <rect x="300" y="280" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="280" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <text x="390" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bridge App</text>
      <text x="390" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WEAR ENGINE · OKHTTP</text>

      <rect x="580" y="280" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="280" width="180" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="588" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="608" y="295" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="670" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cw-hub</text>
      <text x="670" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8742 · 0-DEP</text>

      <rect x="800" y="280" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="280" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="808" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="824" y="295" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TUI</text>
      <text x="880" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
      <text x="880" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TMUX · HOOKS</text>

      <!-- Legend -->
      <line x1="40" y1="496" x2="960" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="508" x2="134" y2="508" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="142" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WEAR ENGINE P2P</text>
      <line x1="252" y1="508" x2="276" y2="508" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="284" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP · LOCALHOST:8742</text>
      <rect x="424" y="502" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="444" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CW-HUB — KONTRAK INTI</text>
    </svg>
  </div>
</body>
</html>
